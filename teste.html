<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Texto adaptando à imagem</title>

<style>
  body {
    background: #111;
    color: white;
    font-family: sans-serif;
    padding: 40px;
    line-height: 1.7;
  }

  .shape {
    float: left;

    width: 320px;
    height: 320px;

    margin-right: 30px;
    margin-bottom: 20px;

    shape-outside: url(imagens/4ed6074f9a30eacbd77457b53e291178\ copy.png);
    

  }
</style>
</head>
<body>

<img
  class="shape"
  src="imagens/4ed6074f9a30eacbd77457b53e291178 copy.png"
/>

<p>
  Esse texto se adapta automaticamente ao formato da imagem.
  O navegador calcula o contorno e reorganiza as linhas
  dinamicamente. Isso funciona com círculos, polígonos
  e até formas complexas.
</p>

<p>
  É uma técnica muito usada em editoriais modernos,
  landing pages premium e experiências tipográficas.
</p>

</body>
</html>
